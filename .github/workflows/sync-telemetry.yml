name: Realtime Telemetry & Metrics Auto-Sync

on:
  schedule:
    # Run every 3 hours to ensure metrics and cache stay real-time
    - cron: "0 */3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'assets/repo-stats.svg'

permissions:
  contents: write

jobs:
  sync-metrics:
    name: Sync Live Metrics & Telemetry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Telemetry Sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/sync-metrics.py

      - name: Check For Metric Updates
        id: git-check
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain assets/repo-stats.svg README.md)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push Live Telemetry Updates
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/repo-stats.svg README.md
          git commit -m "chore(telemetry): auto-sync live repository metrics and refresh CDN cache [skip ci]"
          git push origin main
