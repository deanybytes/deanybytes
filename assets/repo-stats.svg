    <text x="260" y="128" text-anchor="end" class="mono" font-size="10" fill="#00FF9D" font-weight="bold">PUBLIC SACRED OSS</text>

    <!-- Progress Gauge -->
    <text x="14" y="154" class="mono" font-size="9.5" fill="#6EE7B7">OFFLINE PRIVACY PURITY: 100%</text>
