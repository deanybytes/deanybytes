    <text x="260" y="128" text-anchor="end" class="mono" font-size="10" fill="#00FF9D" font-weight="bold">ROOM SQLITE (100%)</text>

    <!-- Progress Gauge -->
    <text x="14" y="154" class="mono" font-size="9.5" fill="#6EE7B7">VOCABULARY ROOTS: 4,700+ (100%)</text>
    <rect x="14" y="162" width="245" height="8" rx="4" fill="#06281B" />
    <rect x="14" y="162" width="245" height="8" rx="4" fill="url(#meterGrad)" filter="url(#statGlow)" />
  </g>

  <!-- CARD 2: Organization Contribution Radar -->
  <g transform="translate(313, 52)">
