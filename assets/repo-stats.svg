    <text x="14" y="68" class="mono" font-size="10" fill="#A7F3D0">⑂ FORKS &amp; PRs:</text>
    <text x="260" y="68" text-anchor="end" class="mono" font-size="10" fill="#34D399" font-weight="bold">COMMUNITY OPEN</text>

