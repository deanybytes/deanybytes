<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- Deep Islamic Celestial Night Gradient -->
    <linearGradient id="statBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02140D" />
      <stop offset="50%" stop-color="#042316" />
      <stop offset="100%" stop-color="#02140D" />
    </linearGradient>

    <!-- Shifting All-Green Border Gradient -->
    <linearGradient id="statBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF9D">
        <animate attributeName="stop-color" values="#00FF9D;#10B981;#34D399;#00FF9D" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#34D399;#00FF9D;#10B981" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#34D399">
        <animate attributeName="stop-color" values="#34D399;#00FF9D;#10B981;#34D399" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Meter Bar Gradient -->
    <linearGradient id="meterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9D" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Sacred Glow Filter -->
    <filter id="statGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Islamic Dot Lattice Pattern -->
    <pattern id="statLattice" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#0D3B26" />
      <polygon points="10,7 12,10 10,13 8,10" fill="#082A1B" opacity="0.6" />
    </pattern>
  </defs>

  <style>
    @keyframes beaconBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes pulseGlow { 0%, 100% { filter: drop-shadow(0 0 4px #00FF9D); } 50% { filter: drop-shadow(0 0 12px #34D399); } }
    @keyframes progressScan { 0% { width: 0%; } 100% { width: 100%; } }

    .beacon { animation: beaconBlink 1.5s infinite; }
    .title-font { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
    .mono { font-family: 'Fira Code', 'Courier New', monospace; }
    .card-box { fill: #031810; stroke: #0A3320; stroke-width: 1.2; rx: 8; }
    .glow-icon { animation: pulseGlow 3s infinite; }
  </style>

  <!-- Outer Frame -->
  <rect x="2" y="2" width="896" height="316" rx="14" fill="url(#statBgGrad)" stroke="url(#statBorderGrad)" stroke-width="2" />
  <rect x="4" y="4" width="892" height="312" rx="12" fill="url(#statLattice)" />

  <!-- Header Console Bar -->
  <rect x="2" y="2" width="896" height="38" rx="12" fill="#042015" />
  <circle cx="22" cy="21" r="5" fill="#00FF9D" class="beacon" />
  <circle cx="38" cy="21" r="5" fill="#10B981" />
  <circle cx="54" cy="21" r="5" fill="#34D399" />

  <text x="450" y="24" text-anchor="middle" class="mono" font-size="12" fill="#00FF9D" font-weight="bold" letter-spacing="2.5" filter="url(#statGlow)">DEANY BYTES // REPOSITORY TELEMETRY &amp; CONTRIBUTION RADAR</text>
  <text x="875" y="24" text-anchor="end" class="mono" font-size="10.5" fill="#6EE7B7" letter-spacing="1.5">SYNC: 2026-09-22 02:54 UTC</text>

