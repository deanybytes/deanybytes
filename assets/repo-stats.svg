    <text x="260" y="128" text-anchor="end" class="mono" font-size="10" fill="#00FF9D" font-weight="bold">ACTIVE WELCOME</text>

    <!-- Progress Gauge -->
    <text x="14" y="154" class="mono" font-size="9.5" fill="#6EE7B7">ETHICAL BENCHMARK: ZERO AD MONETIZATION</text>
    <rect x="14" y="162" width="245" height="8" rx="4" fill="#06281B" />
