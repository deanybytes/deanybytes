    <text x="14" y="68" class="mono" font-size="10" fill="#A7F3D0">◈ QURAN MASTERY:</text>
    <text x="260" y="68" text-anchor="end" class="mono" font-size="10" fill="#34D399" font-weight="bold">80%+ AYAT COMPREHENSION</text>

    <text x="14" y="88" class="mono" font-size="10" fill="#A7F3D0">■ CODE INTENTION:</text>
    <text x="260" y="88" text-anchor="end" class="mono" font-size="10" fill="#00FF9D" font-weight="bold">SACRED EXCELLENCE</text>

