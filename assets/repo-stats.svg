    <text x="0" y="30" font-size="9.5" fill="#6EE7B7" letter-spacing="1.5">WHERE DEANY PURPOSE MEETS DIGITAL BYTES  ·  ALGORITHMIC ITQAN  ·  SADAQAH JARIYAH</text>
