    <rect x="0" y="0" width="273" height="28" rx="8" fill="#06281B" />
    <text x="12" y="19" class="mono" font-size="11" fill="#00FF9D" font-weight="bold" letter-spacing="1">▶ FLAGSHIP: QuranicWords</text>

    <!-- Details -->
