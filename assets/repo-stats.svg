  </g>

  <!-- Bottom Console Status Ribbon -->
  <g transform="translate(450, 268)" text-anchor="middle" class="mono">
    <rect x="-430" y="0" width="860" height="38" rx="8" fill="#031810" stroke="#0A3320" stroke-width="1.2" />
    <text x="0" y="16" font-size="10.5" fill="#A7F3D0" letter-spacing="2">
      <tspan fill="#00FF9D" font-weight="bold">★ REPO STARS</tspan> · <tspan fill="#34D399">⑂ FORKS &amp; DISCUSSIONS</tspan> · <tspan fill="#00FF9D">◈ LEITNER SRS ENGINE</tspan> · <tspan fill="#34D399">◆ SACRED OPEN SOURCE</tspan>
