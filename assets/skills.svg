<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="100%" height="100%">
  <defs>
    <!-- Border Gradient (Emerald Green & Mint) -->
    <linearGradient id="skBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF9D">
        <animate attributeName="stop-color" values="#00FF9D;#10B981;#34D399;#00FF9D" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#34D399;#00FF9D;#10B981" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#34D399">
        <animate attributeName="stop-color" values="#34D399;#00FF9D;#10B981;#34D399" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Progress Meter Gradients -->
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9D" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#00FF9D" />
    </linearGradient>
  </defs>

  <style>
    @keyframes barPulse { 0%, 100% { filter: drop-shadow(0 0 4px #00FF9D); } 50% { filter: drop-shadow(0 0 10px #34D399); } }
    .hud-box { fill: #02140D; }
    .mono-hdr { font-family: 'Fira Code', 'Courier New', monospace; font-size: 12px; fill: #6EE7B7; }
    .mono-lbl { font-family: 'Fira Code', 'Courier New', monospace; font-size: 12px; fill: #E6EDF3; font-weight: 600; }
    .mono-pct { font-family: 'Fira Code', 'Courier New', monospace; font-size: 11.5px; fill: #00FF9D; font-weight: bold; }
    .pulse-meter { animation: barPulse 3.5s ease-in-out infinite; }
  </style>

  <!-- Frame -->
  <rect x="2" y="2" width="896" height="246" rx="12" class="hud-box" stroke="url(#skBorder)" stroke-width="1.8" />

  <!-- Header -->
  <rect x="2" y="2" width="896" height="34" rx="12" fill="#042015" />
  <line x1="2" y1="36" x2="898" y2="36" stroke="#0D3B26" stroke-width="1" />
  
  <text x="24" y="23" class="mono-hdr" fill="#00FF9D" font-weight="bold">◈ ISLAMIC TECH &amp; PURPOSE-DRIVEN ENGINEERING MATRIX</text>
  <text x="876" y="23" text-anchor="end" class="mono-hdr" fill="#34D399">STANDARD: [ITQAN // EXCELLENCE]</text>

  <!-- Skills Rows -->
  <g transform="translate(24, 62)">
    
    <!-- Skill 1: Android & Quranic Apps -->
    <text x="0" y="0" class="mono-lbl">📱 ANDROID &amp; QURANIC ARCHITECTURE <tspan fill="#6EE7B7" font-weight="normal">(Kotlin · Jetpack Compose · Room SQLite · Offline SRS)</tspan></text>
    <text x="850" y="0" text-anchor="end" class="mono-pct" fill="#00FF9D">98% [EXCELLENT]</text>
    <rect x="0" y="8" width="850" height="9" rx="3" fill="#06281B" />
    <rect x="0" y="8" width="833" height="9" rx="3" fill="url(#barGrad1)" class="pulse-meter" />

    <!-- Skill 2: Quranic Linguistic Tech -->
    <text x="0" y="42" class="mono-lbl">📖 QURANIC LINGUISTIC TECH &amp; DATA <tspan fill="#6EE7B7" font-weight="normal">(4,700+ Vocab Analysis · Root Parsing · Lemma Frequency)</tspan></text>
    <text x="850" y="42" text-anchor="end" class="mono-pct" fill="#34D399">96% [VERIFIED]</text>
    <rect x="0" y="50" width="850" height="9" rx="3" fill="#06281B" />
    <rect x="0" y="50" width="816" height="9" rx="3" fill="url(#barGrad2)" class="pulse-meter" />

    <!-- Skill 3: Python Automation & Dawah Tooling -->
    <text x="0" y="84" class="mono-lbl">🐍 PYTHON &amp; DAWAH AUTOMATION <tspan fill="#6EE7B7" font-weight="normal">(Data Extraction · Content Pipelines · REST APIs · Scripture Tools)</tspan></text>
    <text x="850" y="84" text-anchor="end" class="mono-pct" fill="#00FF9D">95% [ACTIVE]</text>
    <rect x="0" y="92" width="850" height="9" rx="3" fill="#06281B" />
    <rect x="0" y="92" width="807" height="9" rx="3" fill="url(#barGrad1)" class="pulse-meter" />

    <!-- Skill 4: Privacy-First & Ethical Code -->
    <text x="0" y="126" class="mono-lbl">🛡️ ETHICAL SOFTWARE &amp; PRIVACY-FIRST <tspan fill="#6EE7B7" font-weight="normal">(Zero Tracking · No Ads · 100% Offline-First · Open Standards)</tspan></text>
    <text x="850" y="126" text-anchor="end" class="mono-pct" fill="#34D399">100% [ABSOLUTE]</text>
    <rect x="0" y="134" width="850" height="9" rx="3" fill="#06281B" />
    <rect x="0" y="134" width="850" height="9" rx="3" fill="url(#barGrad2)" class="pulse-meter" />

    <!-- Skill 5: Linux Systems & Open Source -->
    <text x="0" y="168" class="mono-lbl">🐧 LINUX PASSIONATE &amp; OPEN SOURCE INFRASTRUCTURE <tspan fill="#6EE7B7" font-weight="normal">(POSIX · Shell · Git Workflows · CI/CD Automation)</tspan></text>
    <text x="850" y="168" text-anchor="end" class="mono-pct" fill="#00FF9D">94% [STABLE]</text>
    <rect x="0" y="176" width="850" height="9" rx="3" fill="#06281B" />
    <rect x="0" y="176" width="799" height="9" rx="3" fill="url(#barGrad1)" class="pulse-meter" />

  </g>
</svg>
