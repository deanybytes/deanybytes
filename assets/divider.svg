<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 32" width="100%" height="32">
  <defs>
    <!-- Sacred Divider Beam Gradient -->
    <linearGradient id="divBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9D" stop-opacity="0" />
      <stop offset="30%" stop-color="#00FF9D" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="1" />
      <stop offset="70%" stop-color="#34D399" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00FF9D" stop-opacity="0" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="divGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes spinStarNode {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .rotating-star-node {
      transform-origin: 425px 16px;
      animation: spinStarNode 12s linear infinite;
    }
  </style>

  <!-- Central Laser Line -->
  <line x1="0" y1="16" x2="850" y2="16" stroke="url(#divBeam)" stroke-width="1.8" />

  <!-- Orbiting Rings & Central Node -->
  <circle cx="425" cy="16" r="13" fill="#02140D" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="3,2" />
  
  <!-- Rotating 8-Point Rub el Hizb Node -->
  <g class="rotating-star-node">
    <rect x="420" y="11" width="10" height="10" fill="#00FF9D" opacity="0.85" />
    <rect x="420" y="11" width="10" height="10" fill="#F59E0B" opacity="0.85" transform="rotate(45 425 16)" />
  </g>

  <!-- Central Light Core -->
  <circle cx="425" cy="16" r="2.5" fill="#FFFFFF" filter="url(#divGlow)" />
</svg>