<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 32" width="100%" height="32">
  <defs>
    <!-- Sacred Divider Beam Gradient (Pure Green) -->
    <linearGradient id="divBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9D" stop-opacity="0" />
      <stop offset="35%" stop-color="#00FF9D" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="1" />
      <stop offset="65%" stop-color="#00FF9D" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00FF9D" stop-opacity="0" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="divGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #00FF9D); }
      50% { transform: scale(1.15); filter: drop-shadow(0 0 10px #34D399); }
    }
    .glowing-orb {
      transform-origin: 425px 16px;
      animation: pulseOrb 3s ease-in-out infinite;
    }
  </style>

  <!-- Central Laser Line -->
  <line x1="0" y1="16" x2="850" y2="16" stroke="url(#divBeam)" stroke-width="1.8" />

  <!-- Orbiting Static Rings & Central Glowing Lotus Orb -->
  <circle cx="425" cy="16" r="13" fill="#02140D" stroke="#00FF9D" stroke-width="1.2" stroke-dasharray="3,2" />
  <circle cx="425" cy="16" r="8" fill="#042316" stroke="#34D399" stroke-width="1" />
  
  <!-- Pulsing Central Emerald Core (NO MOVING BOXES) -->
  <circle cx="425" cy="16" r="4" fill="#00FF9D" class="glowing-orb" filter="url(#divGlow)" />
</svg>